  fire_resistant:  "&6Balo Netherite không thể bị thiêu rụi!"
  double_click_hint: "&7Nhấn chuột trái &ex2 nhanh &7để đeo balo."
  sneak_hint_open: "&7Để balo ở &eô 9 &7và ngồi &ex2 &7để mở."
  sneak_hint_menu: "&7Để balo ở &eô 8 &7và ngồi &ex2 &7để mở menu."

# ═══════════════════════════════════════════════════════════
# PERMISSIONS OVERVIEW
# ═══════════════════════════════════════════════════════════
# backpack.craft.leather     — Craft balo da
# backpack.craft.copper      — Craft balo đồng
# backpack.craft.iron        — Craft balo sắt
# backpack.craft.gold        — Craft balo vàng
# backpack.craft.diamond     — Craft balo kim cương
# backpack.craft.netherite   — Craft balo netherite
# backpack.use.*             — Dùng tất cả bậc balo
# backpack.admin             — Lệnh admin
# backpack.*                 — Toàn quyền

# ═══════════════════════════════════════════════════════════
# PERFORMANCE
# ═══════════════════════════════════════════════════════════
performance:
  magnet_task_interval_ticks: 10   # Tần suất check nam châm (mỗi 0.5s)
  feeding_task_interval_ticks: 40  # Tần suất tự ăn (mỗi 2s)
  pickup_task_interval_ticks: 5    # Tần suất thu nhặt (mỗi 0.25s)
